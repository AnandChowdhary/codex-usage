name: Release

# Every push to main that passes CI is released: the version comes from the
# conventional commits since the last tag (see scripts/next-version.sh), and
# GoReleaser builds the binaries and writes the changelog. Pushes with only
# docs/test/ci/chore commits aren't released.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [auto, patch, minor, major]
        default: auto

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Pick version
        id: version
        env:
          BUMP: ${{ inputs.bump || 'auto' }}
        run: |
          version=$(scripts/next-version.sh "$BUMP")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ -n "$version" ]; then
            echo "Releasing $version" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Nothing to release: no feature, fix or other code changes since the last tag." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Tag
        if: steps.version.outputs.version != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git tag "$VERSION"
          git push origin "$VERSION"
      - uses: goreleaser/goreleaser-action@v7
        if: steps.version.outputs.version != ''
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
